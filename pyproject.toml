[project]
name = "magicpin"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore:Field name \"register\" in \"CategoryVoice\" shadows an attribute:UserWarning",
    "ignore:.*Using `httpx` with `starlette.testclient`.*:DeprecationWarning",
]

[tool.vercel]
entrypoint = "src.main:app"
